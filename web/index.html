<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sigh</title>
<meta name="description" content="A quiet shared counter for a bad day at work.">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <span class="wordmark">sigh</span>
  <button type="button" id="theme" class="quiet" aria-pressed="false">
    <span id="theme-label">dark</span>
  </button>
</header>

<!-- First visit, or after the phrase is cleared. -->
<main id="gate" class="screen" hidden>
  <form id="gate-form" class="gate">
    <h1 class="gate-title">what is your group's phrase?</h1>
    <p class="gate-note">
      one phrase for the whole group. it decides which counter you see, and it is the
      only thing that identifies you: no account, no name, no sign in.
    </p>
    <label class="field">
      <span class="field-label">phrase</span>
      <input id="phrase" name="phrase" type="text" autocomplete="off" autocapitalize="none"
             spellcheck="false" maxlength="200" required>
    </label>
    <p id="gate-error" class="notice" role="alert" hidden></p>
    <button type="submit" class="solid" id="gate-submit">open the counter</button>
  </form>
</main>

<!-- The counter itself. -->
<main id="counter" class="screen" hidden>

  <section class="today" aria-labelledby="today-label">
    <p id="count" class="count" data-state="loading">&nbsp;</p>
    <p id="today-label" class="count-label">checking</p>
  </section>

  <button type="button" id="sigh" class="sigh" disabled>
    <span class="sigh-label">sigh</span>
  </button>

  <!-- The rank arrives here. Announced, because it is the whole point of pressing. -->
  <p id="rank" class="rank" role="status" aria-live="polite">&nbsp;</p>

  <section class="history" aria-labelledby="history-label">
    <h2 id="history-label" class="history-title">the last 90 days</h2>
    <div id="bars" class="bars" role="img" aria-label="Daily counts for the last 90 days"></div>
    <p id="history-note" class="history-note">&nbsp;</p>
  </section>

  <footer class="foot">
    <span id="reset-note">resets at midnight</span>
    <button type="button" id="leave" class="quiet">use a different phrase</button>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
